name: Render Motion Studio 3.0
on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Motor de video"
        type: choice
        options: [hyperframes, classic]
        default: hyperframes
      title:
        description: "Título principal"
        required: true
        default: "Tu negocio merece una web"
      subtitle:
        description: "Texto secundario"
        required: true
        default: "Diseño web, apps y sistemas"
      script:
        description: "Guion dividido en frases. Cada frase se ilustra con logos, comparaciones o ejemplos."
        required: false
        default: "Claude es similar a ChatGPT. Codex ayuda a programar. GitHub Actions renderiza el video."
      cta:
        description: "Llamada a la acción"
        required: true
        default: "Cotiza por WhatsApp"
      style:
        description: "Estilo visual"
        type: choice
        options: [high-energy, engaging, clean]
        default: high-energy
      format:
        description: "Formato"
        type: choice
        options: [vertical, horizontal, square]
        default: vertical
      accent:
        description: "Color hexadecimal"
        default: "#FF7A00"
      duration:
        description: "Duración en segundos (6-20)"
        type: number
        default: 12
      sound:
        description: "Efectos de sonido"
        type: boolean
        default: true
  issues:
    types: [opened]
  push:
    branches: [main]
    paths:
      - ".github/workflows/render.yml"
      - "scripts/hyperframes_build.py"
      - "scripts/literal_scenes.py"
permissions:
  contents: read
  issues: write
jobs:
  render:
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == 'aldo200908-lgtm' &&
       startsWith(github.event.issue.title, '[Motion Studio]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      HYPERFRAMES_NO_UPDATE_CHECK: "1"
      ENGINE: ${{ github.event_name == 'push' && 'hyperframes' || inputs.engine }}
      TITLE: ${{ github.event_name == 'push' && 'Motion Studio con HyperFrames' || inputs.title }}
      SUBTITLE: ${{ github.event_name == 'push' && 'Animaciones HTML GSAP FFmpeg' || inputs.subtitle }}
      SCRIPT: ${{ inputs.script }}
      CTA: ${{ github.event_name == 'push' && 'Hecho desde Android' || inputs.cta }}
      STYLE: ${{ github.event_name == 'push' && 'high-energy' || inputs.style }}
      FORMAT: ${{ github.event_name == 'push' && 'horizontal' || inputs.format }}
      ACCENT: ${{ github.event_name == 'push' && '#FF7A00' || inputs.accent }}
      DURATION: ${{ github.event_name == 'push' && '6' || inputs.duration }}
      SOUND: ${{ github.event_name == 'push' && 'false' || toJSON(inputs.sound) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate request and choose engine
        id: request
        run: python scripts/hyperframes_build.py --mode select
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          ffmpeg -version | head -1
      - name: Install Python Pillow (classic engine)
        if: steps.request.outputs.engine == 'classic'
        run: python -m pip install --disable-pip-version-check "Pillow>=10,<13"
      - name: Render with classic Pillow engine
        if: steps.request.outputs.engine == 'classic'
        run: python scripts/motion_v2.py
      - name: Set up Node.js 22 (HyperFrames)
        if: steps.request.outputs.engine == 'hyperframes'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install HyperFrames and GSAP
        if: steps.request.outputs.engine == 'hyperframes'
        run: |
          npm install --no-save --no-audit --no-fund hyperframes@0.8.216 gsap@3.14.2 simple-icons@16.36.0
          ./node_modules/.bin/hyperframes --version
      - name: Build HyperFrames HTML composition
        if: steps.request.outputs.engine == 'hyperframes'
        run: python scripts/hyperframes_build.py --mode compose
      - name: Validate and render via real HyperFrames CLI
        if: steps.request.outputs.engine == 'hyperframes'
        working-directory: hyperframes-project
        run: |
          ../node_modules/.bin/hyperframes lint
          ../node_modules/.bin/hyperframes render --output ../output/hyperframes_raw.mp4 --fps 24 --quality standard --workers 1
      - name: Mix original effects and create storyboards
        if: steps.request.outputs.engine == 'hyperframes'
        env:
          INCLUDE_SOUND: ${{ steps.request.outputs.sound }}
        run: |
          if [ "$INCLUDE_SOUND" = "true" ]; then
            ffmpeg -hide_banner -loglevel error -y -i output/hyperframes_raw.mp4 -i output/sfx.wav \
              -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 128k \
              -af "loudnorm=I=-16:TP=-3:LRA=11" -shortest output/video.mp4
          else
            mv output/hyperframes_raw.mp4 output/video.mp4
          fi
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          duration = json.loads(Path("output/metadata.json").read_text())["duration"]
          scenes = json.loads(Path("output/metadata.json").read_text()).get("scene_plan", [])
          count = len(scenes) or 4
          for n in range(count):
              t = round(duration * (n+.5) / count, 3)
              subprocess.run(["ffmpeg","-hide_banner","-loglevel","error","-y",
                              "-ss",str(t),"-i","output/video.mp4",
                              "-frames:v","1",f"output/storyboard-{n+1:02d}.png"],check=True)
          PY
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 output/video.mp4
      - name: Upload MP4 and storyboard
        uses: actions/upload-artifact@v4
        with:
          name: motion-studio-mp4
          path: |
            output/video.mp4
            output/metadata.json
            output/CREDITS.txt
            output/storyboard-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Reply to request issue
        if: success() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const url = context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ Render terminado. Descarga el MP4 y las vistas del storyboard desde **Artifacts → motion-studio-mp4**: ' + url
            });
